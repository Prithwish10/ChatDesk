apiVersion: apps/v1
kind: Deployment
metadata:
  name: conversation-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: conversation
  template:
    metadata:
      labels:
        app: conversation
    spec:
      containers:
        - name: conversation
          image: prithwishdas60/conversation
          env:
            - name: NATS_URL
              value: 'http://nats-srv:4222'
            - name: NATS_CLUSTER_ID
              value: chat
            - name: NATS_CLIENT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MONGO_URL
              value: 'mongodb://conversation-mongo-srv:27017'
            - name: REDIS_HOST
              value: conversation-redis-srv
            - name: DB_NAME
              value: 'conversation'
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: conversation-srv
spec:
  selector:
    app: conversation
  ports:
    - name: conversation
      protocol: TCP
      port: 3000
      targetPort: 3000